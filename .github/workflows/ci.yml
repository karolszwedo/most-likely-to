name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads the repo, so the token gets read access and nothing more.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm test
      - run: npm run test:hooks
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    # A hung `supabase start` (image pull) would otherwise wait for GitHub's 6 h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A fixed CLI version: "latest" asks the GitHub API on every run, and on shared runners that sometimes fails with
      # "rate limit exceeded" before any test runs (a red check with nothing broken). Bump it by hand.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' > supabase.env
      # The publishable key (sb_publishable_…), as in production; the legacy anon key would make
      # getPublicSupabaseConfig return null. The Worker's signing key (LIVE_SIGNING_KEY, room-chat) is a throwaway one
      # made for this run, written only into .dev.vars and never printed. KLIPY's key (KLIPY_API_KEY, room-chat-gifs) is
      # a fixed fake one in the shape the Worker takes, no secret: smoke checks only that the room's page hands it on,
      # and nothing in CI ever calls KLIPY.
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > .env
          cp .env .dev.vars
          node scripts/signing-key.mjs --env-line >> .dev.vars
          echo 'KLIPY_API_KEY=ci-fake-klipy-key' >> .dev.vars
      # Local Supabase keeps "Confirm email" off (supabase/config.toml), so a plain sign-up creates the smoke test account.
      - name: Create smoke test account
        run: |
          source supabase.env
          SMOKE_EMAIL=smoke-host@example.com
          SMOKE_PASSWORD=$(openssl rand -hex 16)
          curl -sf -o /dev/null -X POST "$API_URL/auth/v1/signup" \
            -H "apikey: $PUBLISHABLE_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\"}"
          printf 'SMOKE_EMAIL=%s\nSMOKE_PASSWORD=%s\n' "$SMOKE_EMAIL" "$SMOKE_PASSWORD" >> .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup

  # Database rules through REST/RPC as a guest and as a host (tests/db), then the owner's view (supabase/tests, pgTAP),
  # on a throwaway local stack. A job of its own: its own red signal, in parallel with smoke.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Fixed version, as in smoke.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: npm ci
      # The suite reads only TEST_SUPABASE_*; its guard refuses anything but a local URL and a publishable key.
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' > supabase.env
          source supabase.env
          printf 'TEST_SUPABASE_URL=%s\nTEST_SUPABASE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      # Verbose: the log names every test, so a known hole ("znana dziura … → …"), when there is one, shows up by name.
      - run: npm run test:db -- --reporter=verbose
      # The creator's view (supabase/tests, pgTAP): catalog, grants, publication and rows left behind, read as the
      # database owner on this same throwaway stack, which the publishable key cannot see. Also after a red Vitest step,
      # so one run shows both sets.
      - name: Database owner's view (pgTAP)
        if: success() || failure()
        run: supabase test db
      - if: always()
        run: supabase stop --no-backup

  # The lobby as players see it (tests/e2e, Playwright): the real build in a browser, against a throwaway local stack.
  # Realtime stays on here (smoke and db skip it), because the room's bell is what the specs check.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Fixed version, as in smoke.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local Supabase (with Realtime)
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' > supabase.env
      # The build copies .dev.vars into dist/server/.dev.vars, which the preview reads. playwright.config.ts refuses to
      # start unless that file points at this local stack with a publishable key. The Worker's signing key
      # (LIVE_SIGNING_KEY, room-chat) is a throwaway one made for this run, written only into .dev.vars and never printed.
      # KLIPY's key (KLIPY_API_KEY, room-chat-gifs) is a fixed fake one, no secret: nothing in CI ever calls KLIPY.
      - name: Point the build at the local stack
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > .env
          cp .env .dev.vars
          node scripts/signing-key.mjs --env-line >> .dev.vars
          echo 'KLIPY_API_KEY=ci-fake-klipy-key' >> .dev.vars
      # Local Supabase keeps "Confirm email" off (supabase/config.toml), so a plain sign-up creates the host account.
      - name: Create the E2E host account
        run: |
          source supabase.env
          E2E_USERNAME=e2e-host@example.com
          E2E_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$E2E_PASSWORD"
          curl -sf -o /dev/null -X POST "$API_URL/auth/v1/signup" \
            -H "apikey: $PUBLISHABLE_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$E2E_USERNAME\",\"password\":\"$E2E_PASSWORD\"}"
          printf 'E2E_USERNAME=%s\nE2E_PASSWORD=%s\n' "$E2E_USERNAME" "$E2E_PASSWORD" >> "$GITHUB_ENV"
      # Playwright builds the app and starts the preview itself (webServer in playwright.config.ts).
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
